---
- name: Check for netplan
  ansible.builtin.stat:
    path: /usr/sbin/netplan
  register: node_resilience_netplan_bin

- name: Configure netplan
  when: node_resilience_netplan_bin.stat.exists
  block:
    - name: Read dhcp4 for each netplan ID
      ansible.builtin.command:
        argv: [netplan, get, "ethernets.{{ item }}.dhcp4"]
      loop: "{{ netplan_keep_config_interfaces }}"
      register: node_resilience_dhcp4
      changed_when: false
      check_mode: false

    - name: Pick the netplan IDs that use DHCP
      ansible.builtin.set_fact:
        node_resilience_dhcp_ids: >-
          {{ node_resilience_dhcp4.results
             | selectattr('stdout', 'equalto', 'true')
             | map(attribute='item') | list }}

    # The candidate is checked with `netplan generate` against a copy of
    # /etc/netplan, so a bad drop-in never lands where the next boot reads it.
    - name: Write the netplan drop-in
      ansible.builtin.template:
        src: keep-config-on-link-loss.yaml.j2
        dest: "{{ netplan_keep_config_file }}"
        owner: root
        group: root
        mode: "0600"
        validate: >-
          sh -c 'root=$(mktemp -d) && mkdir -p "$root/etc" &&
          cp -a /etc/netplan "$root/etc/netplan" &&
          cp "$1" "$root{{ netplan_keep_config_file }}" &&
          netplan generate --root-dir "$root"; rc=$?; rm -rf "$root"; exit $rc' _ %s
      register: node_resilience_netplan_dropin
      when: node_resilience_dhcp_ids | length > 0

    - name: Remove the netplan drop-in when no ID uses DHCP
      ansible.builtin.file:
        path: "{{ netplan_keep_config_file }}"
        state: absent
      register: node_resilience_netplan_removed
      when: node_resilience_dhcp_ids | length == 0

    - name: Apply the netplan configuration
      ansible.builtin.command: netplan apply
      changed_when: true
      when:
        - netplan_keep_config_apply | bool
        - node_resilience_netplan_dropin is changed or node_resilience_netplan_removed is changed

    - name: Wait for the node to answer again
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120
      when:
        - netplan_keep_config_apply | bool
        - node_resilience_netplan_dropin is changed or node_resilience_netplan_removed is changed

    - name: Read the rendered networkd configuration
      ansible.builtin.slurp:
        src: /run/systemd/network/10-netplan-{{ item }}.network
      loop: "{{ node_resilience_dhcp_ids }}"
      register: node_resilience_networkd
      when: netplan_keep_config_apply | bool

    - name: Check networkd keeps the address through carrier loss
      ansible.builtin.assert:
        that:
          - "'ConfigureWithoutCarrier=yes' in (item.content | b64decode)"
          - "'KeepConfiguration=true' in (item.content | b64decode)"
        fail_msg: "{{ item.source }} lacks ConfigureWithoutCarrier=yes or KeepConfiguration=true"
        quiet: true
      loop: "{{ node_resilience_networkd.results | default([]) | selectattr('content', 'defined') | list }}"
      loop_control:
        label: "{{ item.source | default(item.item) }}"
      when: netplan_keep_config_apply | bool
