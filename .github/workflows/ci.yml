---
name: "CI"
on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - '**/.gitignore'
      - '**/FUNDING.yml'
      - '**/host.ini'
      - '**/*.md'
      - '**/.editorconfig'
      - '**/ansible.example.cfg'
      - '**/deploy.sh'
      - '**/LICENSE'
      - '**/reboot.sh'
      - '**/reset.sh'
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  # Molecule boots VirtualBox VMs, which GitHub-hosted runners can't do.
  # Set the MOLECULE_RUNNER repository variable to the label of a
  # self-hosted runner with VirtualBox and Vagrant to turn these on.
  pre:
    if: vars.MOLECULE_RUNNER != ''
    uses: ./.github/workflows/cache.yml
  test:
    if: vars.MOLECULE_RUNNER != ''
    uses: ./.github/workflows/test.yml
    needs: [pre, lint]
